name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Google Analytics goes into the deployed Pages site only; the source and local builds stay tag-free.
      # The measurement ID comes from the repository variable GA_MEASUREMENT_ID (Settings → Variables → Actions).
      - name: Add Google Analytics to the Pages build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GA_MEASUREMENT_ID != ''
        env:
          GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const id = process.env.GA_ID.trim();
          if (!/^G-[A-Z0-9]+$/.test(id)) throw new Error(`GA_MEASUREMENT_ID looks wrong: ${id}`);
          const tag = `<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=${id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', '${id}');
          </script>`;
          const file = 'dist/index.html';
          const html = fs.readFileSync(file, 'utf8');
          if (!html.includes('<head>')) throw new Error('No <head> in dist/index.html');
          fs.writeFileSync(file, html.replace('<head>', `<head>\n${tag}`));
          EOF
          grep -q "googletagmanager.com/gtag/js?id=${GA_ID}" dist/index.html
          echo "Google Analytics added to dist/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
